name: Deploy Go Lambda with SAM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' \
            <<< "$RESPONSE")

          export TOKEN
          node -e '
            const p = JSON.parse(
              Buffer.from(process.env.TOKEN.split(".")[1], "base64url").toString()
            );
            console.log(JSON.stringify({
              sub: p.sub,
              aud: p.aud,
              repository: p.repository,
              repository_id: p.repository_id,
              repository_owner_id: p.repository_owner_id,
              ref: p.ref
            }, null, 2));
          '


      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Build
        run: sam build

      - name: Deploy existing stack
        run: |
          sam deploy \
            --stack-name test \
            --region ap-south-1 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset